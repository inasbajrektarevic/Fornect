<div class="spacer" aria-hidden="true"></div>

<nav [attr.aria-label]="'nav.label' | translate">
  <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" /></svg>
    <span>{{ 'nav.home' | translate }}</span>
  </a>

  <a routerLink="/devices" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>
    <span>{{ 'dashboard.devices' | translate }}</span>
  </a>

  <a routerLink="/protection" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" /></svg>
    <span>{{ 'dashboard.protection' | translate }}</span>
  </a>

  <a routerLink="/schedules" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
    <span>{{ 'dashboard.schedules' | translate }}</span>
  </a>

  <a routerLink="/notifications" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
    <span>{{ 'common.notifications' | translate }}</span>

    @if (unread() > 0) {
      <b class="badge">{{ unread() }}</b>
    }
  </a>
</nav>
